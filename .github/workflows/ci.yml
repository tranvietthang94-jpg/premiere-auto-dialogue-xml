name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Windows .NET 10
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.302

      - name: Restore
        run: dotnet restore PremiereAutoDialogueXml.slnx

      - name: Build
        run: dotnet build PremiereAutoDialogueXml.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test PremiereAutoDialogueXml.slnx --configuration Release --no-build --logger "trx;LogFileName=phase01-tests.trx"
